<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitCheck Tactical has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kitchecktactical.com/">
<meta http-equiv="refresh" content="0; url=https://kitchecktactical.com/">
<script>
(function () {
  var prefix = '/kitcheck-tactical-app';
  var p = location.pathname;
  if (p === prefix || p.indexOf(prefix + '/') === 0) p = p.slice(prefix.length);
  if (p.charAt(0) !== '/') p = '/' + p;
  if (/\/index\.html$/.test(p)) p = p.slice(0, -10);
  var target = 'https://kitchecktactical.com' + p + location.search + location.hash;
  var c = document.querySelector('link[rel=canonical]'); if (c) c.href = target;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  }
  if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
  location.replace(target);
})();
</script>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0;padding:1rem;text-align:center}a{color:#f0b429}</style>
</head>
<body>
<main>
<h1>KitCheck Tactical has moved</h1>
<p>The app now lives at <a href="https://kitchecktactical.com/">kitchecktactical.com</a>.</p>
</main>
</body>
</html>
