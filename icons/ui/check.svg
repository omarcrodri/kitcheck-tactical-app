<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" overflow="visible">
  <defs>
    <filter id="kct-check-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.05" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Fat stamp check: short left leg, longer right leg, butt caps, slightly rounded vertex. Color #9bd15a. Sized for 16–20px on a leader line. -->
  <path d="M4.85 12.4 L9.95 18.25 L19.25 5.7" stroke="#9bd15a" stroke-width="3.6" stroke-linecap="butt" stroke-linejoin="round" filter="url(#kct-check-glow)"/>
</svg>
